<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Contact | 7VN Studios</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Contact | 7VN Studios">
<meta property="og:description" content="Get in touch with 7VN Studios for your next event, brand video or edit.">
<meta property="og:image" content="https://7vn-studios.github.io/7vn-Portfolio/assets/og-image.png">
<meta property="og:url" content="https://7vn-studios.github.io/7vn-Portfolio/contact.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact | 7VN Studios">
<meta name="twitter:description" content="Get in touch with 7VN Studios for your next event, brand video or edit.">
<meta name="twitter:image" content="https://7vn-studios.github.io/7vn-Portfolio/assets/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact.html">

<header id="site-header" class="site-header"></header>

<main>
  <section class="page-header">
    <div class="wrap">
      <h1 class="page-title">Let's talk</h1>
      <p style="color:var(--muted); max-width:520px;">Tell us about your event, brand or channel, and we'll get back to you.</p>
    </div>
  </section>

  <section class="reel-section">
    <div class="wrap contact-grid">
      <div>
        <div class="contact-methods" id="contactMethods"></div>
      </div>

      <form id="contactForm">
        <div class="form-field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/main.js"></script>
<script>
async function init() {
  const config = await loadJSON('data/config.json');
  document.getElementById('contactMethods').innerHTML = `
    <a class="contact-method" href="${config.contact.whatsapp}" target="_blank" rel="noopener">
      <div>
        <div class="label">WhatsApp</div>
        <div class="value">Message us directly</div>
      </div>
      <span>→</span>
    </a>
    <a class="contact-method" href="mailto:${config.contact.email}">
      <div>
        <div class="label">Email</div>
        <div class="value">${config.contact.email}</div>
      </div>
      <span>→</span>
    </a>
  `;

  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const message = document.getElementById('message').value;
    const subject = encodeURIComponent(`New enquiry from ${name}`);
    const body = encodeURIComponent(`${message}\n\nFrom: ${name} (${email})`);
    window.location.href = `mailto:${config.contact.email}?subject=${subject}&body=${body}`;
  });
}
init();
</script>
</body>
</html>
