<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Services | 7VN Studios</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Services | 7VN Studios">
<meta property="og:description" content="Event coverage, marketing videos, motion design and creator editing from 7VN Studios.">
<meta property="og:image" content="https://7vn-studios.github.io/7vn-Portfolio/assets/og-image.png">
<meta property="og:url" content="https://7vn-studios.github.io/7vn-Portfolio/services.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Services | 7VN Studios">
<meta name="twitter:description" content="Event coverage, marketing videos, motion design and creator editing from 7VN Studios.">
<meta name="twitter:image" content="https://7vn-studios.github.io/7vn-Portfolio/assets/og-image.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services.html">

<header id="site-header" class="site-header"></header>

<main>
  <section class="page-header">
    <div class="wrap">
      <h1 class="page-title">Services</h1>
      <p style="color:var(--muted); max-width:520px;">Pricing below is a starting guide. Every project gets a proper quote once we know the scope.</p>
    </div>
  </section>

  <section class="reel-section">
    <div class="wrap">
      <div class="services-list" id="servicesList"></div>
      <div class="more-cta">
        <a href="contact.html" class="btn btn-primary">Request a quote</a>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/main.js"></script>
<script>
async function init() {
  const config = await loadJSON('data/config.json');
  document.getElementById('servicesList').innerHTML = config.services.map(s => `
    <div class="service-row">
      <div>
        <h3>${s.name}</h3>
        <p>${s.description}</p>
      </div>
      <div class="price">${s.price}</div>
    </div>
  `).join('');
}
init();
</script>
</body>
</html>
